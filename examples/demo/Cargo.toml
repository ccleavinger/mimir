[package]
name = "mimir-demo"
version = "0.1.0"
edition = "2021"

[features]
default = ["ui", "backend", "vulkan"]
ui = []
backend = ["dep:mimir"]
vulkan = ["backend", "mimir/vulkan"]
cuda = ["backend", "mimir/cuda"]

[dependencies]
mimir = { path = "../../crates/mimir", default-features = false, optional = true }
serde_json = "1.0"

