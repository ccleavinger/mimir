[workspace]
members = ["crates/*", "examples/demo", "examples/matmul", "examples/mnist", "examples/mnist-cnn", "fixtures/linked-kernels"]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
description = "Workspace for Mimir"

[workspace.dependencies]
mimir-ast = { path = "crates/mimir-ast" }
mimir-ir = { path = "crates/mimir-ir" }
mimir-macros = { path = "crates/mimir-macros" }
mimir-rs-compiler = { path = "crates/mimir-rs-compiler" }
mimir-runtime-core = { path = "crates/mimir-runtime-core" }
mimir-cuda-runtime = { path = "crates/mimir-cuda-runtime" }
mimir-vulkan-runtime = { path = "crates/mimir-vulkan-runtime" }
mimir-runtime = { path = "crates/mimir-runtime", default-features = false }

# external crates

## GPU crates

### Vulkan
ash = "0.38.0"
rspirv = "0.13"


## Error management & logging
anyhow = "1.0"
thiserror = "2.0"

## async & multi-threaded crates
serde = "1.0"

## low level stuff

## proc macro and parsing stuff
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
