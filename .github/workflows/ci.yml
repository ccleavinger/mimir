name: Rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y spirv-tools mesa-vulkan-drivers
      - run: cargo test --workspace --locked
      - run: cargo test -p mimir --test kernel --locked -- --ignored
      - run: cargo test -p mimir --test launch --locked -- --ignored
      - run: cargo test -p mimir --test default_runtime --locked -- --ignored
      - run: cargo test -p mimir --test array --locked -- --ignored
      - run: cargo test -p mimir-runtime --lib --locked -- --ignored
      - run: cargo check -p mimir --no-default-features --locked
      - run: cargo check -p mimir --target aarch64-linux-android --locked
      - run: cargo check -p mimir --target aarch64-unknown-linux-gnu --no-default-features --locked
      - run: cargo test -p mimir-linked-fixture --release --locked
        env:
          CARGO_PROFILE_RELEASE_LTO: 'true'
      - name: Check backend exclusion
        run: |
          cargo tree -p mimir --no-default-features -e normal > /tmp/dependencies
          if grep -E '(ash v|mimir-codegen-spirv v)' /tmp/dependencies; then exit 1; fi
