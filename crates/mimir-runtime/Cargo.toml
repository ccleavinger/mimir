[package]
name = "mimir-runtime"
version = "0.1.0"
edition = "2024"
authors = ["Caleb Cleavinger caleb.cleavinger@gmail.com"]
description = "Unified platform-aware runtime for Mimir"
license = "MIT or Apache-2.0"
repository = "https://github.com/ccleavinger/mimir/tree/master/crates/mimir-runtime"

[dependencies]
mimir-ir = { path = "../mimir-ir" }
mimir-runtime-core = { path = "../mimir-runtime-core" }
thiserror = "2.0.16"

linkme = "0.3.36"

[features]
default = ["vulkan"]
vulkan = ["dep:mimir-vulkan-runtime"]
cuda = ["dep:mimir-cuda-runtime"]

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "windows"))'.dependencies]
mimir-vulkan-runtime = { path = "../mimir-vulkan-runtime", optional = true }

[target.'cfg(all(any(target_os = "linux", target_os = "windows"), target_pointer_width = "64"))'.dependencies]
mimir-cuda-runtime = { path = "../mimir-cuda-runtime", optional = true }
