## THIS IS ONLY SUPPOSED TO BE USED IN CONTJUCTION WITH THE `mimir-omni-runtime` CRATE
[package]
name = "mimir-macros"
version = "0.1.0"
edition = "2021"
authors = ["Caleb Cleavinger caleb.cleavinger@gmail.com"]
description = "Core Macros for the Mimir GPU programming framework"
license = "MIT or Apache-2.0"
repository = "https://github.com/ccleavinger/mimir/tree/master/crates/mimir-gpu"

[lib]
proc-macro = true

[dependencies]
mimir-ir.workspace = true
mimir-runtime.workspace = true
mimir-rs-compiler.workspace = true

syn.workspace = true
quote.workspace = true
cfg-if.workspace = true
proc-macro-error3.workspace = true
proc-macro2.workspace = true
small_uid.workspace = true
regex.workspace = true

[features]

default = ["bin"]

bin = []

json = []
